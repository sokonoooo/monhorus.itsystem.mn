name: monhorus_mobile
description: Monhorus mobile client for technicians, customers and administrators.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Credential storage
  flutter_secure_storage: ^9.2.2

  # Value equality for entities
  equatable: ^2.0.7

  # Fira Sans / Fira Sans Condensed. Fetched once and cached to disk.
  #
  # NOT the mock's Barlow: Barlow carries no Cyrillic at all — 0 of the 64 basic
  # letters and none of Mongolian's Ө/ө/Ү/ү — so every string would silently fall
  # back to the system face. Fira Sans is the same humanist-body/condensed-heading
  # pairing with full Cyrillic. See the note in `customer_tokens.dart`.
  google_fonts: ^6.2.1

  # Camera and gallery access for the photo a service request must carry.
  #
  # Same plugin and same version as apps/mobile-employee, deliberately: the two apps
  # share `lib/core/media/photo_capture.dart` line for line, so a picture a customer
  # attaches and one a technician attaches go through identical type and size checks.
  #
  # Needs NSCameraUsageDescription and NSPhotoLibraryUsageDescription in
  # ios/Runner/Info.plist — iOS terminates the app on first use without them.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
